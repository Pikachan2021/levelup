<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root { --accent: #2563eb; --accent2: #059669; --bg: #0f172a; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg); color: #fff; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 16px;
    }
    .name { font-size: 22px; font-weight: 700; margin: 12px 0 4px; }
    .date { font-size: 14px; color: #94a3b8; margin-bottom: 20px; }
    .buttons { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 16px; }
    button.item {
      width: 100%; padding: 28px 16px; font-size: 24px; font-weight: 700;
      color: #fff; border: none; border-radius: 18px; cursor: pointer;
      background: var(--accent); box-shadow: 0 6px 16px rgba(0,0,0,.35);
      transition: transform .05s ease, filter .1s ease;
    }
    button.item:nth-child(2) { background: var(--accent2); }
    button.item:active { transform: scale(.97); filter: brightness(1.1); }
    button.item:disabled { opacity: .5; }
    .sub { font-size: 14px; font-weight: 400; opacity: .85; display: block; margin-top: 6px; }
    .undo {
      margin-top: 8px; background: transparent; color: #cbd5e1;
      border: 1px solid #475569; border-radius: 12px; padding: 14px;
      font-size: 16px; width: 100%; max-width: 460px; cursor: pointer;
    }
    .undo:active { background: #1e293b; }
    #toast {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(40px);
      background: #111827; color: #fff; padding: 14px 20px; border-radius: 12px;
      font-size: 16px; max-width: 90%; text-align: center; opacity: 0;
      transition: all .25s ease; pointer-events: none; box-shadow: 0 6px 20px rgba(0,0,0,.4);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.err { background: #7f1d1d; }
    .error-box { background: #7f1d1d; padding: 16px; border-radius: 12px; max-width: 460px; }
  </style>
</head>
<body>
  <? if (!valid) { ?>
    <div class="error-box">
      URL が正しくありません。<br>
      <code>?staff=emeli&amp;token=...</code> の形式で開いてください。
    </div>
  <? } else { ?>
    <div class="name"><?= staffName ?></div>
    <div class="date" id="today"></div>

    <div class="buttons">
      <? for (var i = 0; i < items.length; i++) { ?>
        <button class="item" onclick="punch('<?= items[i] ?>', this)">
          <?= items[i] ?>
          <span class="sub">タップで現在時刻を記録</span>
        </button>
      <? } ?>
    </div>

    <button class="undo" onclick="undoLast()">↩ 直前の打刻を取り消す</button>

    <div id="toast"></div>

    <script>
      var STAFF = '<?= staffKey ?>';
      var TOKEN = '<?= token ?>';
      var lastItem = null;

      document.getElementById('today').textContent = formatToday();

      function formatToday() {
        var d = new Date();
        var w = ['日','月','火','水','木','金','土'][d.getDay()];
        return d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate() + '（' + w + '）';
      }

      function showToast(msg, isErr) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'show' + (isErr ? ' err' : '');
        setTimeout(function () { t.className = ''; }, 2600);
      }

      function setBusy(busy) {
        var btns = document.querySelectorAll('button');
        for (var i = 0; i < btns.length; i++) btns[i].disabled = busy;
      }

      function punch(item, btn) {
        lastItem = item;
        setBusy(true);
        google.script.run
          .withSuccessHandler(function (res) {
            setBusy(false);
            showToast(res.message, !res.ok);
          })
          .withFailureHandler(function (err) {
            setBusy(false);
            showToast('通信エラー: ' + err.message, true);
          })
          .recordPunch(STAFF, item, TOKEN);
      }

      function undoLast() {
        if (!lastItem) { showToast('まだ打刻していません', true); return; }
        setBusy(true);
        google.script.run
          .withSuccessHandler(function (res) {
            setBusy(false);
            showToast(res.message, !res.ok);
          })
          .withFailureHandler(function (err) {
            setBusy(false);
            showToast('通信エラー: ' + err.message, true);
          })
          .undoPunch(STAFF, lastItem, TOKEN);
      }
    </script>
  <? } ?>
</body>
</html>
