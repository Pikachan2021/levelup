<!DOCTYPE html>
<!--
  プレビュー版（スタンドアロン）/ Standalone preview
  - デプロイ不要。このファイルをダブルクリックしてブラウザで開くだけ。
  - 実際のスプレッドシートには書き込みません（見た目・操作感の確認用）。
  - 本番は Index.html + Code.gs を Apps Script にデプロイして使います。
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time Entry - Preview</title>
  <style>
    :root { --accent: #2563eb; --accent2: #059669; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
      background: #f1f5f9; color: #0f172a;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(2,6,23,.12);
      padding: 28px 40px 32px; width: 100%; max-width: 720px;
    }
    .preview-tag {
      display: inline-block; font-size: 12px; color: #92400e; background: #fef3c7;
      border: 1px solid #fde68a; border-radius: 999px; padding: 3px 10px; margin-bottom: 16px;
    }
    .staffbar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .staffbar button {
      border: 1px solid #cbd5e1; background: #fff; color: #334155;
      border-radius: 999px; padding: 8px 16px; font-size: 14px; cursor: pointer;
    }
    .staffbar button.active { background: #0f172a; color: #fff; border-color: #0f172a; }
    .header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
    .name { font-size: 26px; font-weight: 700; }
    .date { font-size: 15px; color: #64748b; }
    .hint { font-size: 13px; color: #94a3b8; margin-bottom: 24px; }
    .buttons { display: flex; gap: 20px; }
    button.item {
      flex: 1; padding: 40px 16px; font-size: 24px; font-weight: 700;
      color: #fff; border: none; border-radius: 14px; cursor: pointer;
      background: var(--accent); box-shadow: 0 4px 12px rgba(37,99,235,.3);
      transition: transform .06s ease, box-shadow .15s ease, filter .15s ease;
    }
    button.item:nth-child(2) { background: var(--accent2); box-shadow: 0 4px 12px rgba(5,150,105,.3); }
    button.item:hover { filter: brightness(1.06); box-shadow: 0 6px 18px rgba(2,6,23,.22); }
    button.item:active { transform: translateY(2px); }
    .footer { margin-top: 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .undo {
      background: #fff; color: #475569; border: 1px solid #cbd5e1; border-radius: 10px;
      padding: 12px 18px; font-size: 15px; cursor: pointer;
    }
    .undo:hover { background: #f8fafc; }
    #status { font-size: 16px; min-height: 24px; }
    #status.ok { color: #047857; }
    #status.err { color: #b91c1c; }
    .mock { margin-top: 22px; border-top: 1px dashed #e2e8f0; padding-top: 14px; }
    .mock h4 { margin: 0 0 8px; font-size: 13px; color: #64748b; font-weight: 600; }
    .mock table { border-collapse: collapse; font-size: 13px; }
    .mock td, .mock th { border: 1px solid #e2e8f0; padding: 4px 10px; text-align: center; }
    .mock th { background: #f8fafc; color: #475569; }
  </style>
</head>
<body>
  <div class="card">
    <span class="preview-tag">Preview (no data is written)</span>

    <div class="staffbar" id="staffbar"></div>

    <div class="header">
      <div class="name" id="name"></div>
      <div class="date" id="today"></div>
    </div>
    <div class="hint">Click a button to record the current time on today's row.</div>

    <div class="buttons" id="buttons"></div>

    <div class="footer">
      <div id="status"></div>
      <button class="undo" onclick="undoLast()">↩ Undo last entry</button>
    </div>

    <div class="mock">
      <h4>↓ How it lands in the sheet (today's row)</h4>
      <table id="mocktable"></table>
    </div>
  </div>

  <script>
    // ---- デモ用データ（本番は Code.gs の CONFIG.STAFF と同じ）----
    var STAFF = {
      emeli:  { name: 'Eemeli', items: ['Packing', 'Company Work'] },
      markus: { name: 'Markus', items: ['Packing', 'Company Work'] },
      tuomas: { name: 'Tuomas', items: ['Packing', 'Company Work'] },
      antti:  { name: 'Antti',  items: ['Packing', 'Company Work'] }
    };
    var current = 'emeli';
    // セルの中身を保持（プレビュー用の擬似スプレッドシート）
    var cells = {}; // key: staffKey|item -> "08:00, 12:30"
    var lastKey = null;

    function fmtToday() {
      var d = new Date();
      var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return days[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
    }
    function nowHHmm() {
      var d = new Date();
      return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
    }
    function showStatus(msg, err) {
      var s = document.getElementById('status');
      s.textContent = msg; s.className = err ? 'err' : 'ok';
    }

    function renderStaffbar() {
      var bar = document.getElementById('staffbar'); bar.innerHTML = '';
      Object.keys(STAFF).forEach(function (k) {
        var b = document.createElement('button');
        b.textContent = STAFF[k].name;
        b.className = (k === current) ? 'active' : '';
        b.onclick = function () { current = k; render(); };
        bar.appendChild(b);
      });
    }
    function renderButtons() {
      var wrap = document.getElementById('buttons'); wrap.innerHTML = '';
      STAFF[current].items.forEach(function (item) {
        var b = document.createElement('button');
        b.className = 'item';
        b.innerHTML = item + '<span style="font-size:14px;font-weight:400;opacity:.9;display:block;margin-top:8px;">Click to record current time</span>';
        b.onclick = function () { punch(item); };
        wrap.appendChild(b);
      });
    }
    function renderMock() {
      var t = document.getElementById('mocktable');
      var items = STAFF[current].items;
      var head = '<tr><th>Date</th>' + items.map(function (i) { return '<th>' + STAFF[current].name + '<br>' + i + '</th>'; }).join('') + '</tr>';
      var d = new Date();
      var row = '<tr><td>' + d.getDate() + '</td>' + items.map(function (i) {
        return '<td>' + (cells[current + '|' + i] || '') + '</td>';
      }).join('') + '</tr>';
      t.innerHTML = head + row;
    }
    function render() {
      document.getElementById('name').textContent = STAFF[current].name;
      renderStaffbar(); renderButtons(); renderMock();
    }

    function punch(item) {
      var key = current + '|' + item, now = nowHHmm();
      cells[key] = cells[key] ? (cells[key] + ', ' + now) : now;
      lastKey = key;
      showStatus('✓ ' + STAFF[current].name + ' · ' + item + ' · ' + now + ' recorded', false);
      renderMock();
    }
    function undoLast() {
      if (!lastKey || !cells[lastKey]) { showStatus('Nothing to undo', true); return; }
      var parts = cells[lastKey].split(',').map(function (s) { return s.trim(); }).filter(String);
      var removed = parts.pop();
      cells[lastKey] = parts.join(', ');
      showStatus('↩ removed ' + removed, false);
      renderMock();
    }

    document.getElementById('today').textContent = fmtToday();
    render();
  </script>
</body>
</html>
