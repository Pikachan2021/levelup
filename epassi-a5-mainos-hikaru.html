<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Hikaru × ePassi — Lounas 11 € — A5-ovimainos</title>
<style>
  @page {
    size: A5;
    margin: 0;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 148mm;
    height: 210mm;
  }

  body {
    font-family: "Helvetica Neue", Arial, sans-serif;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .poster {
    width: 148mm;
    height: 210mm;
    padding: 11mm 10mm;
    background: linear-gradient(160deg, #fff 0%, #fff 55%, #ffe8ec 100%);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  .poster::before {
    content: "";
    position: absolute;
    top: -40mm;
    right: -40mm;
    width: 110mm;
    height: 110mm;
    border-radius: 50%;
    background: radial-gradient(circle, #ffb199 0%, #ff4f82 60%, #e6337a 100%);
    opacity: 0.18;
  }

  .poster::after {
    content: "";
    position: absolute;
    bottom: -35mm;
    left: -35mm;
    width: 90mm;
    height: 90mm;
    border-radius: 50%;
    background: radial-gradient(circle, #ff7a4a 0%, #ff3d7f 100%);
    opacity: 0.12;
  }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 2;
  }

  .brand {
    font-size: 22pt;
    font-weight: 900;
    letter-spacing: -1px;
    color: #1a1a2e;
  }

  .brand .mark {
    color: #e6337a;
  }

  .logo {
    font-size: 24pt;
    font-weight: 900;
    letter-spacing: -1.5px;
    background: linear-gradient(90deg, #ff7a4a 0%, #ff3d7f 60%, #e6337a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1;
  }

  .logo .dot {
    display: inline-block;
    width: 6pt;
    height: 6pt;
    border-radius: 50%;
    background: #ff7a4a;
    margin-left: -1px;
    vertical-align: top;
    margin-top: 2pt;
  }

  .hero {
    margin-top: 8mm;
    z-index: 2;
    text-align: center;
  }

  .kicker {
    font-size: 11pt;
    font-weight: 700;
    color: #e6337a;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .headline {
    margin-top: 3mm;
    font-size: 40pt;
    font-weight: 900;
    line-height: 0.95;
    color: #1a1a2e;
    letter-spacing: -1.5px;
  }

  .price-block {
    margin: 6mm auto 0;
    display: inline-flex;
    align-items: baseline;
    justify-content: center;
    gap: 2mm;
    background: linear-gradient(135deg, #ff7a4a 0%, #ff3d7f 60%, #e6337a 100%);
    color: white;
    padding: 6mm 10mm;
    border-radius: 8mm;
    box-shadow: 0 8pt 22pt rgba(255, 61, 127, 0.35);
  }

  .price-value {
    font-size: 64pt;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -3px;
  }

  .price-unit {
    font-size: 26pt;
    font-weight: 900;
    line-height: 1;
  }

  .subline {
    margin-top: 6mm;
    font-size: 13pt;
    color: #333;
    font-weight: 500;
    line-height: 1.35;
  }

  .benefits {
    margin-top: 8mm;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 3.5mm;
  }

  .benefit {
    display: flex;
    align-items: center;
    gap: 3mm;
    font-size: 11pt;
    color: #1a1a2e;
    font-weight: 500;
  }

  .check {
    flex-shrink: 0;
    width: 7mm;
    height: 7mm;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff7a4a 0%, #ff3d7f 100%);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 10pt;
    box-shadow: 0 2pt 6pt rgba(255, 61, 127, 0.3);
  }

  .cta {
    margin-top: auto;
    z-index: 2;
    background: #1a1a2e;
    color: white;
    padding: 6mm;
    border-radius: 5mm;
    text-align: center;
  }

  .cta-title {
    font-size: 15pt;
    font-weight: 900;
    letter-spacing: -0.3px;
  }

  .cta-title .accent {
    background: linear-gradient(90deg, #ff7a4a 0%, #ff3d7f 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .cta-text {
    margin-top: 2mm;
    font-size: 10pt;
    font-weight: 400;
    opacity: 0.85;
  }

  .footer {
    margin-top: 3mm;
    text-align: center;
    font-size: 8pt;
    color: #888;
    z-index: 2;
  }

  .footer strong {
    color: #ff3d7f;
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="top-row">
      <div class="brand">Hikaru<span class="mark">.</span></div>
      <div class="logo">epassi<span class="dot"></span></div>
    </div>

    <div class="hero">
      <div class="kicker">Lounas joka päivä</div>
      <div class="headline">Nauti<br>lounas</div>
      <div class="price-block">
        <span class="price-value">11</span>
        <span class="price-unit">€</span>
      </div>
      <div class="subline">
        Maksa kätevästi <strong>ePassilla</strong><br>
        &mdash; lounasetu suoraan puhelimesta.
      </div>
    </div>

    <div class="benefits">
      <div class="benefit"><span class="check">&check;</span> Sisältää pääruoan, salaatin &amp; juoman</div>
      <div class="benefit"><span class="check">&check;</span> ePassi, Smartum, Edenred hyväksytään</div>
      <div class="benefit"><span class="check">&check;</span> Arkisin klo 11&ndash;14</div>
    </div>

    <div class="cta">
      <div class="cta-title">Tervetuloa lounaalle <span class="accent">Hikaruun</span></div>
      <div class="cta-text">Näytä QR-koodi kassalla &mdash; siinä kaikki.</div>
    </div>

    <div class="footer">
      Lisätietoa: <strong>epassi.fi</strong>
    </div>
  </div>
</body>
</html>
