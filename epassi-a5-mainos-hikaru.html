<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Hikaru — Lounas 11 € — A5-ovimainos</title>
<style>
  @page {
    size: A5;
    margin: 0;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 148mm;
    height: 210mm;
  }

  body {
    font-family: "Helvetica Neue", Arial, sans-serif;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .poster {
    width: 148mm;
    height: 210mm;
    padding: 11mm 10mm;
    background: linear-gradient(160deg, #fff 0%, #fff 55%, #ffe8ec 100%);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  .poster::before {
    content: "";
    position: absolute;
    top: -40mm;
    right: -40mm;
    width: 110mm;
    height: 110mm;
    border-radius: 50%;
    background: radial-gradient(circle, #ffb199 0%, #ff4f82 60%, #e6337a 100%);
    opacity: 0.15;
  }

  .poster::after {
    content: "";
    position: absolute;
    bottom: -35mm;
    left: -35mm;
    width: 90mm;
    height: 90mm;
    border-radius: 50%;
    background: radial-gradient(circle, #ff7a4a 0%, #ff3d7f 100%);
    opacity: 0.1;
  }

  .top-row {
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2;
  }

  .brand {
    font-size: 30pt;
    font-weight: 900;
    letter-spacing: -1.5px;
    color: #1a1a2e;
  }

  .brand .mark {
    color: #e6337a;
  }

  .hero {
    margin-top: 8mm;
    z-index: 2;
    text-align: center;
  }

  .kicker {
    font-size: 11pt;
    font-weight: 700;
    color: #e6337a;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .headline {
    margin-top: 3mm;
    font-size: 44pt;
    font-weight: 900;
    line-height: 0.95;
    color: #1a1a2e;
    letter-spacing: -1.5px;
  }

  .price-block {
    margin: 6mm auto 0;
    display: inline-flex;
    align-items: baseline;
    justify-content: center;
    gap: 2mm;
    background: linear-gradient(135deg, #ff7a4a 0%, #ff3d7f 60%, #e6337a 100%);
    color: white;
    padding: 6mm 12mm;
    border-radius: 8mm;
    box-shadow: 0 8pt 22pt rgba(255, 61, 127, 0.35);
  }

  .price-value {
    font-size: 68pt;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -3px;
  }

  .price-unit {
    font-size: 28pt;
    font-weight: 900;
    line-height: 1;
  }

  .subline {
    margin-top: 5mm;
    font-size: 12pt;
    color: #333;
    font-weight: 500;
    line-height: 1.35;
  }

  .info {
    margin-top: 7mm;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 2.5mm;
    text-align: center;
  }

  .info-row {
    font-size: 11pt;
    color: #1a1a2e;
    font-weight: 500;
  }

  .info-row strong {
    font-weight: 800;
  }

  .divider {
    margin: 6mm auto 0;
    width: 40mm;
    height: 1pt;
    background: #e6337a;
    opacity: 0.4;
  }

  .payment {
    margin-top: 5mm;
    z-index: 2;
    text-align: center;
  }

  .payment-label {
    font-size: 9pt;
    font-weight: 700;
    color: #666;
    letter-spacing: 2.5px;
    text-transform: uppercase;
  }

  .payment-methods {
    margin-top: 3mm;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5mm;
    flex-wrap: wrap;
  }

  .pm {
    font-size: 13pt;
    font-weight: 800;
    color: #444;
    letter-spacing: -0.3px;
  }

  .pm.epassi {
    font-size: 16pt;
    background: linear-gradient(90deg, #ff7a4a 0%, #ff3d7f 60%, #e6337a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .pm.epassi .dot {
    display: inline-block;
    width: 4pt;
    height: 4pt;
    border-radius: 50%;
    background: #ff7a4a;
    margin-left: -1px;
    vertical-align: top;
    margin-top: 1.5pt;
  }

  .cta {
    margin-top: auto;
    z-index: 2;
    background: #1a1a2e;
    color: white;
    padding: 6mm;
    border-radius: 5mm;
    text-align: center;
  }

  .cta-title {
    font-size: 15pt;
    font-weight: 900;
    letter-spacing: -0.3px;
  }

  .cta-title .accent {
    background: linear-gradient(90deg, #ff7a4a 0%, #ff3d7f 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .cta-text {
    margin-top: 2mm;
    font-size: 10pt;
    font-weight: 400;
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="top-row">
      <div class="brand">Hikaru<span class="mark">.</span></div>
    </div>

    <div class="hero">
      <div class="kicker">Lounas arkisin</div>
      <div class="headline">Päivän<br>lounas</div>
      <div class="price-block">
        <span class="price-value">11</span>
        <span class="price-unit">€</span>
      </div>
      <div class="subline">
        Pääruoka, salaattipöytä,<br>
        leipä, vesi &amp; kahvi.
      </div>
    </div>

    <div class="info">
      <div class="info-row"><strong>Ma&ndash;Pe</strong> &nbsp;klo 11&ndash;14</div>
    </div>

    <div class="divider"></div>

    <div class="payment">
      <div class="payment-label">Hyväksymme lounasedut</div>
      <div class="payment-methods">
        <span class="pm epassi">epassi<span class="dot"></span></span>
        <span class="pm">Smartum</span>
        <span class="pm">Edenred</span>
      </div>
    </div>

    <div class="cta">
      <div class="cta-title">Tervetuloa <span class="accent">Hikaruun</span></div>
      <div class="cta-text">Maksu käteisellä, kortilla tai lounasedulla.</div>
    </div>
  </div>
</body>
</html>
