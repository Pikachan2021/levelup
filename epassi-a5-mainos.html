<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>ePassi A5 -ovimainos</title>
<style>
  @page { size: A5; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 148mm; height: 210mm; }

  body {
    font-family: "Helvetica Neue", Arial, sans-serif;
    background: #fff;
    color: #1a1a1a;
  }

  .poster {
    width: 148mm;
    height: 210mm;
    padding: 24mm 14mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .label {
    font-size: 12pt;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #666;
  }

  .headline {
    margin-top: 10mm;
    font-size: 36pt;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -1.5px;
  }

  .logo {
    margin-top: 10mm;
    font-size: 70pt;
    font-weight: 900;
    letter-spacing: -3px;
    line-height: 1;
    background: linear-gradient(90deg, #ff7a4a 0%, #ff3d7f 60%, #e6337a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .logo .dot {
    display: inline-block;
    width: 14pt;
    height: 14pt;
    border-radius: 50%;
    background: #ff7a4a;
    margin-left: 2px;
    vertical-align: top;
    margin-top: 6pt;
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="label">Täällä voit maksaa</div>
    <div class="logo">epassi<span class="dot"></span></div>
  </div>
</body>
</html>
