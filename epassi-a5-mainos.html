<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>ePassi A5 -ovimainos</title>
<style>
  @page {
    size: A5;
    margin: 0;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 148mm;
    height: 210mm;
  }

  body {
    font-family: "Helvetica Neue", Arial, sans-serif;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .poster {
    width: 148mm;
    height: 210mm;
    padding: 12mm 10mm;
    background: linear-gradient(160deg, #fff 0%, #fff 55%, #ffe8ec 100%);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  .poster::before {
    content: "";
    position: absolute;
    top: -40mm;
    right: -40mm;
    width: 110mm;
    height: 110mm;
    border-radius: 50%;
    background: radial-gradient(circle, #ffb199 0%, #ff4f82 60%, #e6337a 100%);
    opacity: 0.18;
  }

  .poster::after {
    content: "";
    position: absolute;
    bottom: -35mm;
    left: -35mm;
    width: 90mm;
    height: 90mm;
    border-radius: 50%;
    background: radial-gradient(circle, #ff7a4a 0%, #ff3d7f 100%);
    opacity: 0.12;
  }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 2;
  }

  .logo {
    font-size: 38pt;
    font-weight: 900;
    letter-spacing: -2px;
    background: linear-gradient(90deg, #ff7a4a 0%, #ff3d7f 60%, #e6337a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1;
  }

  .logo .dot {
    display: inline-block;
    width: 8pt;
    height: 8pt;
    border-radius: 50%;
    background: #ff7a4a;
    margin-left: -2px;
    vertical-align: top;
    margin-top: 4pt;
  }

  .badge {
    background: linear-gradient(135deg, #ff7a4a 0%, #ff3d7f 100%);
    color: white;
    font-size: 9pt;
    font-weight: 700;
    padding: 6pt 12pt;
    border-radius: 100pt;
    text-transform: uppercase;
    letter-spacing: 1px;
    box-shadow: 0 4pt 12pt rgba(255, 61, 127, 0.3);
  }

  .hero {
    margin-top: 15mm;
    z-index: 2;
  }

  .headline {
    font-size: 34pt;
    font-weight: 900;
    line-height: 0.95;
    color: #1a1a2e;
    letter-spacing: -1px;
  }

  .headline .highlight {
    background: linear-gradient(90deg, #ff7a4a 0%, #ff3d7f 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subline {
    margin-top: 4mm;
    font-size: 13pt;
    color: #555;
    font-weight: 500;
    line-height: 1.3;
  }

  .benefits {
    margin-top: 10mm;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 4mm;
  }

  .benefit {
    display: flex;
    align-items: center;
    gap: 3mm;
    font-size: 11pt;
    color: #1a1a2e;
    font-weight: 500;
  }

  .check {
    flex-shrink: 0;
    width: 7mm;
    height: 7mm;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff7a4a 0%, #ff3d7f 100%);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 10pt;
    box-shadow: 0 2pt 6pt rgba(255, 61, 127, 0.3);
  }

  .cta {
    margin-top: auto;
    z-index: 2;
    background: linear-gradient(135deg, #ff7a4a 0%, #ff3d7f 60%, #e6337a 100%);
    color: white;
    padding: 8mm 6mm;
    border-radius: 6mm;
    text-align: center;
    box-shadow: 0 6pt 20pt rgba(255, 61, 127, 0.35);
  }

  .cta-title {
    font-size: 18pt;
    font-weight: 900;
    letter-spacing: -0.5px;
  }

  .cta-text {
    margin-top: 2mm;
    font-size: 10pt;
    font-weight: 500;
    opacity: 0.95;
  }

  .footer {
    margin-top: 4mm;
    text-align: center;
    font-size: 8pt;
    color: #888;
    z-index: 2;
  }

  .footer strong {
    color: #ff3d7f;
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="top-row">
      <div class="logo">epassi<span class="dot"></span></div>
      <div class="badge">Hyväksytty täällä</div>
    </div>

    <div class="hero">
      <div class="headline">
        Maksa<br>
        <span class="highlight">ePassilla</span>
      </div>
      <div class="subline">
        Liikunta-, kulttuuri-, hyvinvointi-<br>
        ja lounasedut yhdessä sovelluksessa.
      </div>
    </div>

    <div class="benefits">
      <div class="benefit"><span class="check">&check;</span> Nopea maksu mobiilisti</div>
      <div class="benefit"><span class="check">&check;</span> Veroton työnantajaetu</div>
      <div class="benefit"><span class="check">&check;</span> Ei käteistä, ei korttia</div>
    </div>

    <div class="cta">
      <div class="cta-title">Avaa sovellus &amp; maksa</div>
      <div class="cta-text">Näytä QR-koodi kassalla — siinä kaikki.</div>
    </div>

    <div class="footer">
      Lisätietoa: <strong>epassi.fi</strong> &nbsp;|&nbsp; Tervetuloa!
    </div>
  </div>
</body>
</html>
